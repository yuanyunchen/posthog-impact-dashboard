query($q: String!, $first: Int!, $after: String) {
  rateLimit { cost remaining resetAt }
  search(query: $q, type: ISSUE, first: $first, after: $after) {
    issueCount
    pageInfo { hasNextPage endCursor }
    nodes {
      ... on PullRequest {
        number title body url
        author { login __typename }
        authorAssociation
        createdAt mergedAt
        additions deletions changedFiles
        mergedBy { login }
        baseRefName isCrossRepository headRepositoryOwner { login }
        autoMergeRequest { enabledBy { login } }
        labels(first: 20) { nodes { name } }
        files(first: 100) { totalCount nodes { path additions deletions } }
        reviews(first: 50) { totalCount nodes { author { login __typename } authorAssociation state submittedAt body } }
        reviewThreads { totalCount }
        comments { totalCount }
        commits { totalCount }
        closingIssuesReferences(first: 10) { totalCount nodes { number title } }
      }
    }
  }
}
